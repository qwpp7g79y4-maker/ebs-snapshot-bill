[package]
name = "ebs-snapshot-bill"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline estimate of AWS EBS snapshot GB-month cost from describe-snapshots JSON"
readme = "README.md"
repository = "https://github.com/qwpp7g79y4-maker/ebs-snapshot-bill"
homepage = "https://github.com/qwpp7g79y4-maker/ebs-snapshot-bill"
documentation = "https://github.com/qwpp7g79y4-maker/ebs-snapshot-bill"
keywords = ["aws", "ebs", "snapshot", "cost", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "*-plugin/"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rust_decimal = "1.43.0"
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
